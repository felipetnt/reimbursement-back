quarkus.application.name=reimbursement-api
quarkus.http.port=8080

# MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=admin
quarkus.datasource.password=admin123
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/reimbursement_db

# Hibernate apenas valida o schema criado pelo Flyway
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.validate-migration-naming=true

# Dev Services desabilitado porque o MySQL é iniciado pelo Docker Compose
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false

# CORS local do Angular
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4040,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger

# JWT: a chave privada assina; a chave pública valida
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=reimbursement-api
smallrye.jwt.new-token.lifespan=3600

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.issuer=reimbursement-api

quarkus.log.level=INFO
